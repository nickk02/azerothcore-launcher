[package]
name = "azerothcore-launcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "launcher_core"
path = "src/lib.rs"

[[bin]]
name = "azerothcore-launcher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
