[package]
name = "azerothcore-core"
version = "0.0.0"
edition = "2021"
description = "UI-free core of the AzerothCore launcher: tunnel, config, realm status, updates, credentials"
license = "MIT"

[lib]
name = "launcher_core"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

[dependencies]
ureq = "3"
gateway = { package = "azerothcore-gateway", path = "../gateway" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }
tokio-tungstenite = "0.30"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
dirs = "7"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
