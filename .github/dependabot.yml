version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # eframe 0.30 and later replace App::update with App::ui and rename egui types.
      # Held until the GUI is migrated.
      - dependency-name: "eframe"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
