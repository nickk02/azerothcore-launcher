name: release

# Fires on a version tag and attaches the installers to the matching release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true

permissions:
  contents: write   # needed to upload the assets onto the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Resolved before the build because the exe is stamped with it. The
      # launcher compares it against the latest release to decide on updates.
      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not vMAJOR.MINOR.PATCH-shaped."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # A release must never ship code whose tests were not run.
      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release
        env:
          AC_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify the binary carries the release version
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.version }}'
          $actual = (Get-Item 'target\release\azerothcore.exe').VersionInfo.FileVersion
          if ($actual -ne $expected) {
            throw "azerothcore.exe reports version '$actual' but the tag says '$expected'."
          }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem -Path @("${env:ProgramFiles(x86)}", $env:ProgramFiles) `
                                -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found after installing innosetup.' }
          & $iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Publish checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer\dist\AzerothCoreSetup.exe -Algorithm SHA256).Hash
          "$hash  AzerothCoreSetup.exe" | Set-Content installer\dist\AzerothCoreSetup.exe.sha256

      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            installer/dist/AzerothCoreSetup.exe
            installer/dist/AzerothCoreSetup.exe.sha256
          fail_on_unmatched_files: true

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        run: |
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not vMAJOR.MINOR.PATCH-shaped." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --workspace --release

      - name: Build app and DMG
        run: scripts/build-macos.sh ${{ steps.version.outputs.version }}

      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/AzerothCore.dmg
            dist/AzerothCore.dmg.sha256
          fail_on_unmatched_files: true

  release-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Test
        run: cargo test --workspace --release

      - name: Build gateway
        run: |
          cargo build --release -p azerothcore-gateway
          cp target/release/azerothcore-gateway azerothcore-gateway-linux-x86_64
          sha256sum azerothcore-gateway-linux-x86_64 > azerothcore-gateway-linux-x86_64.sha256

      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            azerothcore-gateway-linux-x86_64
            azerothcore-gateway-linux-x86_64.sha256
          fail_on_unmatched_files: true
