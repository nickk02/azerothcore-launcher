name: felbite-healthcheck

on:
  schedule:
    - cron: '0 13 * * *'  # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/felbite-healthcheck/check.py
