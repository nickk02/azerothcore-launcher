name: build

# Every push and PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: azerothcore-launcher-windows
          path: target/release/azerothcore.exe
          retention-days: 14
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --release

      - name: Build app and DMG
        run: scripts/build-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: azerothcore-launcher-macos
          path: dist/AzerothCore.dmg
          retention-days: 14
          if-no-files-found: error
