[package]
name = "azerothcore-launcher"
version = "0.0.0"
edition = "2021"
description = "Launcher for World of Warcraft 3.3.5a private servers"
license = "MIT"
build = "build.rs"

[workspace]
members = ["gateway", "core"]

[[bin]]
name = "azerothcore"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
launcher_core = { package = "azerothcore-core", path = "core" }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
