[package]
name = "azerothcore-launcher"
version = "0.0.0"
edition = "2021"
description = "Launcher for World of Warcraft 3.3.5a private servers"
license = "MIT"
build = "build.rs"

[workspace]
members = ["gateway"]

[lib]
name = "launcher_core"
path = "src/lib.rs"

[[bin]]
name = "azerothcore"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
ureq = "2"
gateway = { package = "azerothcore-gateway", path = "gateway" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
